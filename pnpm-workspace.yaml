# Forced up off versions carrying published advisories; drop an entry once the
# upstream dependency ships a fixed version on its own.
overrides:
  postcss: ^8.5.25
  sharp: ^0.35.3
  undici: ^7.28.0
  vite: ^8.0.16
  esbuild@>=0.27.3 <0.28.1: ^0.28.1

# pnpm 11 uses allowBuilds; onlyBuiltDependencies kept for pnpm 10 compat
allowBuilds:
  esbuild: true
  sharp: true
  "@node-rs/argon2": true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - "@node-rs/argon2"
